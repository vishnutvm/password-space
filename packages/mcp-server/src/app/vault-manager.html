<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Space — Vault Manager</title>
    <style>
      :root {
        --ink: #1a1f1c;
        --muted: #5c6b63;
        --paper: #f3f6f2;
        --panel: rgba(255, 255, 255, 0.72);
        --line: rgba(26, 31, 28, 0.12);
        --accent: #0f6b4c;
        --accent-ink: #f4fff9;
        --danger: #9b2c2c;
        --ok: #0f6b4c;
        --err: #9b2c2c;
        --shadow: 0 18px 50px rgba(20, 40, 30, 0.12);
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --font-body: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(15, 107, 76, 0.16), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(40, 70, 55, 0.12), transparent 50%),
          linear-gradient(165deg, #e8eee8 0%, var(--paper) 45%, #eef3ef 100%);
      }
      .shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }
      .hero {
        margin-bottom: 22px;
        animation: rise 520ms ease-out both;
      }
      .brand {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: clamp(2rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .hero h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .lede {
        margin: 12px 0 0;
        max-width: 36rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 18px 18px 16px;
        margin-bottom: 14px;
        box-shadow: var(--shadow);
        animation: rise 640ms ease-out both;
      }
      .panel h2, .panel h3 {
        margin: 0 0 10px;
        font-family: var(--font-display);
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      .panel h3 { font-size: 1.05rem; margin-top: 16px; }
      .hint, .muted { color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
      label {
        display: grid;
        gap: 6px;
        margin: 10px 0;
        font-size: 0.85rem;
        font-weight: 500;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        background: rgba(255,255,255,0.9);
        color: var(--ink);
      }
      input:focus {
        outline: 2px solid rgba(15, 107, 76, 0.35);
        border-color: var(--accent);
      }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .row.between { justify-content: space-between; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      .primary { background: var(--accent); color: var(--accent-ink); }
      .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
      .danger { background: transparent; color: var(--danger); border: 1px solid rgba(155,44,44,0.25); padding: 6px 12px; font-size: 0.8rem; }
      .list { list-style: none; margin: 0; padding: 0; }
      .list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .list li:last-child { border-bottom: 0; }
      .tags { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
      .empty { color: var(--muted); padding: 8px 0; }
      .foot {
        min-height: 1.4em;
        margin: 8px 2px 0;
        font-size: 0.9rem;
        color: var(--muted);
        animation: fade 280ms ease both;
      }
      .foot[data-kind="ok"] { color: var(--ok); }
      .foot[data-kind="err"] { color: var(--err); }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./vault-manager-ui.js"></script>
  </body>
</html>
