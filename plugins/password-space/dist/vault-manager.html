<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Space — Vault Manager</title>
    <style>
      :root {
        --ink: #1c1c1c;
        --muted: #666;
        --bg: #f7f7f5;
        --panel: #fff;
        --line: #ddd;
        --accent: #1a5f45;
        --accent-ink: #fff;
        --danger: #8b1e1e;
        --ok: #1a5f45;
        --err: #8b1e1e;
        --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: var(--font);
        font-size: 15px;
        color: var(--ink);
        background: var(--bg);
      }
      .shell {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px 32px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        font-weight: 600;
      }
      .hint {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.35;
      }
      label {
        display: grid;
        gap: 4px;
        margin: 0 0 10px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 10px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }
      input:focus {
        outline: 2px solid rgba(26, 95, 69, 0.3);
        border-color: var(--accent);
      }
      .actions { margin-top: 4px; }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        width: 100%;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 8px 12px;
        font-weight: 500;
      }
      .danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(139, 30, 30, 0.25);
        padding: 6px 10px;
        font-size: 0.8rem;
        font-weight: 500;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .list { list-style: none; margin: 0 0 14px; padding: 0; }
      .list li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .list li:last-child { border-bottom: 0; }
      .empty { color: var(--muted); padding: 4px 0; }
      .foot {
        min-height: 1.25em;
        margin: 8px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .foot[data-kind="ok"] { color: var(--ok); }
      .foot[data-kind="err"] { color: var(--err); }
    </style>
  </head>
